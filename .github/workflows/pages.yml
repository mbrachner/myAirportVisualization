name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/magical-gauss-vjcu2e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Bundle a snapshot of the Gardermoen OpenStreetMap data so the site loads instantly.
      # Start from the last good snapshot, so a busy Overpass server doesn't leave the site without
      # one. If there is no snapshot at all, the site fetches the data live in the browser.
      - name: Restore last OpenStreetMap snapshot
        uses: actions/cache/restore@v4
        with:
          path: public/data/engm-osm.json
          key: osm-snapshot-${{ github.run_id }}
          restore-keys: osm-snapshot-

      - name: Fetch OpenStreetMap snapshot
        id: fetch_osm
        run: npm run fetch-osm
        continue-on-error: true
        timeout-minutes: 6
        env:
          OSM_REFERER: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Save OpenStreetMap snapshot
        if: steps.fetch_osm.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/engm-osm.json
          key: osm-snapshot-${{ github.run_id }}

      - name: Report snapshot status
        run: |
          if [ "${{ steps.fetch_osm.outcome }}" = "success" ]; then
            echo "::notice::Bundled a fresh OpenStreetMap snapshot."
          elif [ -f public/data/engm-osm.json ]; then
            echo "::warning::Overpass unavailable; bundling the previous OpenStreetMap snapshot."
          else
            echo "::warning::Overpass unavailable and no previous snapshot; the site will load OSM data live."
          fi

      # Keys come from repository secrets (Settings → Secrets and variables → Actions).
      # They end up in the public JavaScript bundle, so restrict them to this site's URL
      # in the Cesium ion and Google Cloud consoles. Missing secrets are fine: the app
      # then uses open map tiles and flat terrain.
      - name: Build
        run: npm run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
