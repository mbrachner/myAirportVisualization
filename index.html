<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oslo Airport 3D</title>
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <aside id="panel">
      <header>
        <div>
          <h1>Oslo Airport Gardermoen</h1>
          <p class="sub">OSL · ENGM · 208 m AMSL</p>
        </div>
        <button id="panel-toggle" type="button" aria-label="Collapse panel">☰</button>
      </header>

      <div class="body">
        <section>
          <h2>Views</h2>
          <div id="views" class="buttons"></div>
        </section>

        <section>
          <h2>Arrival demo</h2>
          <p id="arrival-status" class="arrival-status">Preparing …</p>
          <p id="arrival-route" class="hint"></p>
          <label class="toggle" for="arrival-show-route">
            <input type="checkbox" id="arrival-show-route" checked /> <span>Show planned route</span>
          </label>
          <div id="arrival-controls" class="buttons" hidden>
            <button id="arrival-pause" type="button">Pause</button>
            <button id="arrival-restart" type="button">Restart</button>
            <button id="arrival-follow" type="button">Follow</button>
            <label class="speed" for="arrival-speed">Speed
              <select id="arrival-speed">
                <option value="1">1×</option>
                <option value="3">3×</option>
                <option value="10">10×</option>
              </select>
            </label>
          </div>
          <p id="arrival-warnings" class="hint warning"></p>
        </section>

        <section>
          <h2>Find gate or stand</h2>
          <input id="search" list="places" disabled placeholder="Loading …" autocomplete="off" />
          <datalist id="places"></datalist>
        </section>

        <section>
          <h2>Layers</h2>
          <div id="layers"></div>
        </section>

        <section>
          <h2>3D tiles</h2>
          <div id="tiles"></div>
        </section>

        <section>
          <button id="reload" type="button" class="secondary">Reload live OSM data</button>
        </section>
      </div>
    </aside>

    <div id="status">Starting …</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
